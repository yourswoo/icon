<svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="512" height="512">
  <g transform="translate(14.6286 14.6286) scale(1.9429)">
    <defs>
    <radialGradient id="ringFill" cx="46%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#62F5C9"/>
      <stop offset="38%" stop-color="#28E6A8"/>
      <stop offset="72%" stop-color="#16D89B"/>
      <stop offset="100%" stop-color="#0FCB8F"/>
    </radialGradient>

    <radialGradient id="centerFade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="58%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="78%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="92%" stop-color="#FFFFFF" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1"/>
    </radialGradient>

    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2BE9AD" stop-opacity="0"/>
      <stop offset="74%" stop-color="#2BE9AD" stop-opacity="0"/>
      <stop offset="92%" stop-color="#2BE9AD" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#2BE9AD" stop-opacity="0.65"/>
    </radialGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <mask id="ringMask">
      <rect width="512" height="512" fill="black"/>
      <circle cx="256" cy="256" r="224" fill="white"/>
      <circle cx="256" cy="256" r="132" fill="black"/>
    </mask>
  </defs>

  <circle cx="256" cy="256" r="224" fill="url(#ringFill)" mask="url(#ringMask)"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#2BE9AD" stroke-opacity="0.45"
          stroke-width="18" filter="url(#softGlow)"/>
  <circle cx="256" cy="256" r="132" fill="url(#centerFade)"/>
  <circle cx="256" cy="256" r="132" fill="url(#innerGlow)"/>
  </g>
</svg>
